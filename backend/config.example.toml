# Provider configuration. Copy this file to `config.local.toml` (in backend/,
# same directory as this file) and fill in your real keys, then `chmod 600`.
#
# `config.local.toml` is gitignored (contains secrets). Path is configurable
# via the CIA_CONFIG_PATH env var (defaults to `config.local.toml`, resolved
# relative to the backend/ working directory). Permissions must be 0600 —
# `load_providers` rejects group/other-readable configs.
#
# Each provider is a subtable of [providers]. `api_key` is required;
# `base_url` is optional and overrides the provider's default endpoint;
# `model` is the default model id for this provider (DU01 uses it for the
# Profile extraction agent; DU03+ AgentDefinition may override per-agent).

[providers.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"

[providers.anthropic]
api_key = ""
base_url = "https://api.anthropic.com"
model = "claude-3-5-haiku-latest"
