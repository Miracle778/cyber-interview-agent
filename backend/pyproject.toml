[project]
name = "cyber-interview-agent-backend"
version = "0.1.0"
requires-python = ">=3.12.4"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.3.0",
  "aiosqlite>=0.20.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "keyring>=25.0.0",
  "platformdirs>=4.0.0",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.14.14,<0.15",
  "pytest-cov>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = [
  "windows_stability: concurrency and cancellation contracts repeated on Windows CI",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Start with defects that can break imports or execution. Style cleanup remains
# visible in SonarCloud without forcing a repository-wide formatting rewrite.
select = ["E9", "F63", "F7", "F82"]
