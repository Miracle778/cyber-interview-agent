name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --dev

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests

      - name: Test backend with coverage
        working-directory: backend
        run: uv run pytest -q --tb=short --cov=app --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Test frontend with coverage
        working-directory: frontend
        run: pnpm test:coverage

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Analyze with SonarQube Cloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Explain skipped SonarQube Cloud scan
        if: >-
          github.actor == 'dependabot[bot]' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository)
        run: echo "SONAR_TOKEN is unavailable; tests and builds passed, but analysis was skipped."
