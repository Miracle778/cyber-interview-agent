sonar.projectKey=Miracle778_cyber-interview-agent
sonar.organization=miracle778
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Make the GitHub Actions result an actual merge gate instead of an
# asynchronous dashboard-only scan.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
